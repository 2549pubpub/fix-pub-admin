<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix & Pub | Management System</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>

<div class="container">

<aside class="sidebar">
<div class="logo">
<i class="fas fa-tools"></i>
<span>FIX & PUB</span>
</div>
</aside>

<main class="main-content">

<header>
<h1>ระบบจัดการร้านซ่อม</h1>
</header>

<section class="stats">

<div class="card">
<h3>รอซ่อม</h3>
<p id="pending-count">0</p>
</div>

<div class="card">
<h3>กำลังซ่อม</h3>
<p id="repairing-count">0</p>
</div>

<div class="card">
<h3>เสร็จแล้ว</h3>
<p id="done-count">0</p>
</div>

<div class="card">
<h3>รายได้รวม</h3>
<p id="total-income">0</p>
</div>

</section>

<input type="text" id="search" placeholder="ค้นหา..." class="search">

<button onclick="deleteFinished()" class="btn-delete">
ลบงานที่เสร็จแล้วทั้งหมด
</button>


<section class="content-grid">
    <!-- ระบบอะไหล่ -->

<section class="content-grid">

<div class="form-container">

<h2>เพิ่มอะไหล่</h2>

<form id="part-form">

<input type="text" id="part-name" placeholder="ชื่ออะไหล่" required>

<input type="number" id="part-qty" placeholder="จำนวน" required>

<button type="submit">บันทึกอะไหล่</button>

</form>

</div>

<div class="table-container">

<h2>รายการอะไหล่</h2>

<table>

<thead>
<tr>
<th>ชื่ออะไหล่</th>
<th>จำนวน</th>
<th>จัดการ</th>
</tr>
</thead>

<tbody id="part-list"></tbody>

</table>

</div>

</section>


<div class="form-container">

<h2>เพิ่มงานซ่อม</h2>

<form id="repair-form">

<input type="date" id="repair-date">

<input type="text" id="customer-name" placeholder="ชื่อลูกค้า" required>

<input type="text" id="phone-number" placeholder="เบอร์">

<input type="text" id="phone-model" placeholder="รุ่น" required>

<textarea id="problem" placeholder="อาการ"></textarea>

<input type="number" id="price" placeholder="ราคา">

<input type="number" id="cost" placeholder="ต้นทุน">

<select id="status">
<option>รอซ่อม</option>
<option>กำลังซ่อม</option>
<option>เสร็จแล้ว</option>
</select>

<button type="submit">บันทึก</button>

</form>

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>ID</th>
<th>วันที่</th>
<th>ลูกค้า</th>
<th>รุ่น</th>
<th>ราคา</th>
<th>สถานะ</th>
<th>จัดการ</th>
</tr>

</thead>

<tbody id="repair-list"></tbody>

</table>

</div>

</section>

</main>

</div>

<!-- SIDE PANEL -->

<div id="side-panel" class="side-panel">

<span class="close-btn" onclick="closePanel()">&times;</span>

<h2>รายละเอียดงาน</h2>

<div id="detail-content"></div>

</div>

<script src="script.js"></script>

</body>
</html>
